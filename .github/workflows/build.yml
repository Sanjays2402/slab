name: build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: "macos-arm64", runner: "macos-15" }
          - { name: "linux-x64", runner: "ubuntu-24.04" }
          - { name: "windows-x64", runner: "windows-latest" }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux deps
        if: matrix.platform.runner == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Test (library)
        working-directory: src-tauri
        run: cargo test --lib --verbose

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --lib -- -D warnings

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

  bundle:
    name: bundle (${{ matrix.platform.name }})
    needs: test
    # Bundle only on main pushes / manual dispatch / PRs targeting main.
    # Feature branch pushes get test + clippy + fmt validation only — bundling
    # the full cross-platform matrix on every cron tick is wasteful CI minutes.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: "macos-arm64", runner: "macos-15", target: "aarch64-apple-darwin" }
          - { name: "macos-x64", runner: "macos-15", target: "x86_64-apple-darwin" }
          - { name: "linux-x64", runner: "ubuntu-24.04", target: "x86_64-unknown-linux-gnu" }
          - { name: "windows-x64", runner: "windows-latest", target: "x86_64-pc-windows-msvc" }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux deps
        if: matrix.platform.runner == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.platform.target }}-cargo-bundle-${{ hashFiles('src-tauri/Cargo.lock') }}

      # ── macOS code-signing setup ─────────────────────────────────────────────
      # If APPLE_CERTIFICATE_BASE64 secret is configured, import the Developer ID
      # cert into a temp keychain and export the env vars that Tauri's bundler
      # consumes (APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID).
      # When the secret is absent, this step is a no-op and Tauri falls back to
      # ad-hoc signing (`codesign -s -`) via the entitlements.plist.
      - name: Detect macOS signing capability
        if: startsWith(matrix.platform.runner, 'macos')
        id: macos-sign
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "${APPLE_CERTIFICATE_BASE64}" ]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            echo "🔐 Developer ID secrets present → real signing + notarization"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "🪶 No Developer ID secrets → ad-hoc signing (users need right-click → Open on first launch)"
          fi

      - name: Import Developer ID certificate
        if: steps.macos-sign.outputs.mode == 'developer-id'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/slab-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/slab-signing.keychain-db"

          # Decode cert
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          # Create ephemeral keychain, unlock, set search list
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)

          # Import cert
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign

          # Allow codesign to use the cert without GUI prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Sanity-check: print identity (don't fail build if grep finds nothing)
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

      - name: Build (Tauri bundle, ad-hoc signed)
        if: ${{ !startsWith(matrix.platform.runner, 'macos') || steps.macos-sign.outputs.mode == 'adhoc' }}
        env:
          # Ad-hoc signing for macOS. No-op on Linux/Windows.
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --target ${{ matrix.platform.target }}

      - name: Build (Tauri bundle, Developer ID + notarize)
        if: startsWith(matrix.platform.runner, 'macos') && steps.macos-sign.outputs.mode == 'developer-id'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --target ${{ matrix.platform.target }}

      # ── Verify signature on macOS DMGs ──────────────────────────────────────
      - name: Verify macOS signature
        if: startsWith(matrix.platform.runner, 'macos')
        run: |
          DMG=$(find src-tauri/target/${{ matrix.platform.target }}/release/bundle/dmg -name "*.dmg" -maxdepth 1 | head -1)
          APP=$(find src-tauri/target/${{ matrix.platform.target }}/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
          echo "DMG: $DMG"
          echo "APP: $APP"
          if [ -n "$APP" ]; then
            codesign -dvv "$APP" 2>&1 | head -20 || true
            echo "---"
            echo "Verifying app signature integrity…"
            codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 || echo "⚠️ App signature verify failed (expected on ad-hoc for some configs)"
          fi
          if [ -n "$DMG" ]; then
            echo "---"
            echo "DMG signature:"
            codesign -dvv "$DMG" 2>&1 | head -10 || echo "(DMG not signed — normal for ad-hoc)"
          fi
          echo "---"
          echo "Gatekeeper assessment (expected: rejected for ad-hoc, accepted for Developer ID + notarize):"
          if [ -n "$APP" ]; then
            spctl -a -vv "$APP" 2>&1 || true
          fi

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: slab-${{ matrix.platform.name }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up keychain
        if: always() && startsWith(matrix.platform.runner, 'macos') && steps.macos-sign.outputs.mode == 'developer-id'
        run: |
          security delete-keychain "$RUNNER_TEMP/slab-signing.keychain-db" || true
