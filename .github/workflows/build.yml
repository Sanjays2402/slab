name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: "macos-arm64", runner: "macos-15" }
          - { name: "linux-x64", runner: "ubuntu-24.04" }
          - { name: "windows-x64", runner: "windows-latest" }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.platform.runner == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Test (library)
        working-directory: src-tauri
        run: cargo test --lib --verbose

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --lib -- -D warnings

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

  bundle:
    name: bundle (${{ matrix.platform.name }})
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: "macos-arm64", runner: "macos-15", target: "aarch64-apple-darwin" }
          - { name: "macos-x64", runner: "macos-15", target: "x86_64-apple-darwin" }
          - { name: "linux-x64", runner: "ubuntu-24.04", target: "x86_64-unknown-linux-gnu" }
          - { name: "windows-x64", runner: "windows-latest", target: "x86_64-pc-windows-msvc" }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.platform.runner == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.platform.target }}-cargo-bundle-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build (Tauri bundle)
        run: pnpm tauri build --target ${{ matrix.platform.target }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: slab-${{ matrix.platform.name }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 14
