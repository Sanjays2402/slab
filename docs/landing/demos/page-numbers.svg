<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Page numbers — Roman, Arabic, custom prefix">
  <style>
    .cap { font-family: ui-sans-serif, system-ui; font-size: 13px; fill: #e9ecf2; font-weight: 600; }
    .ink { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; fill: #0c0e12; }
    .doc { fill: #e9ecf2; stroke: #d1d5db; }
    .lbl { font-family: ui-sans-serif, system-ui; font-size: 10px; fill: #9aa3b2; }
    .line { stroke: #9ca3af; stroke-width: 1.2; fill: none; }

    @keyframes numIn { 0%, 15% { opacity: 0; } 40%, 100% { opacity: 1; } }
    .num { animation: numIn 4s infinite ease; }
    .p2 .num { animation-delay: 0.3s; } .p3 .num { animation-delay: 0.6s; }
    .p4 .num { animation-delay: 0.9s; } .p5 .num { animation-delay: 1.2s; }
    @media (prefers-reduced-motion: reduce) { .num { opacity: 1; } }
    </style>
  <rect width="600" height="400" fill="#0c0e12"/>
  <text class="cap" x="300" y="34" text-anchor="middle">Page numbers — Roman, Arabic, custom prefix</text>
  
  <g class="page p1" transform="translate(80,90)">
    <rect class="doc" width="120" height="160" rx="3"/>
    <line class="line" x1="14" y1="24" x2="106" y2="24"/>
    <line class="line" x1="14" y1="40" x2="100" y2="40"/>
    <line class="line" x1="14" y1="56" x2="106" y2="56"/>
    <text class="ink num" x="60" y="148" text-anchor="middle" fill="#7dd3fc" font-weight="700" opacity="0">i</text>
  </g>
  <g class="page p2" transform="translate(220,90)">
    <rect class="doc" width="120" height="160" rx="3"/>
    <line class="line" x1="14" y1="24" x2="106" y2="24"/>
    <line class="line" x1="14" y1="40" x2="100" y2="40"/>
    <line class="line" x1="14" y1="56" x2="106" y2="56"/>
    <text class="ink num" x="60" y="148" text-anchor="middle" fill="#7dd3fc" font-weight="700" opacity="0">ii</text>
  </g>
  <g class="page p3" transform="translate(360,90)">
    <rect class="doc" width="120" height="160" rx="3"/>
    <line class="line" x1="14" y1="24" x2="106" y2="24"/>
    <line class="line" x1="14" y1="40" x2="100" y2="40"/>
    <line class="line" x1="14" y1="56" x2="106" y2="56"/>
    <text class="ink num" x="60" y="148" text-anchor="middle" fill="#7dd3fc" font-weight="700" opacity="0">iii</text>
  </g>
  <g class="page p4" transform="translate(150,280)">
    <rect class="doc" width="120" height="80" rx="3"/>
    <text class="ink num" x="60" y="68" text-anchor="middle" fill="#7dd3fc" font-weight="700" opacity="0">Ch. 1 — 1</text>
  </g>
  <g class="page p5" transform="translate(330,280)">
    <rect class="doc" width="120" height="80" rx="3"/>
    <text class="ink num" x="60" y="68" text-anchor="middle" fill="#7dd3fc" font-weight="700" opacity="0">Ch. 1 — 2</text>
  </g>
    
</svg>
