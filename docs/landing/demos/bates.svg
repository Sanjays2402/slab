<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Bates numbering demo">
  <defs>
    <style>
      .page { fill:#fff; stroke:#94a3b8; stroke-width:.75 }
      .lbl  { font: 600 8px ui-monospace,monospace; fill:#0f172a }
      .line { fill:#cbd5e1 }
      @keyframes count { 0%{opacity:0} 20%,80%{opacity:1} 100%{opacity:0} }
      .stamp { animation: count 4.8s linear infinite }
    </style>
  </defs>
  <rect width="320" height="200" fill="#f8fafc"/>
  <!-- 3 ghost pages cascading -->
  <g transform="translate(80,30)">
    <rect class="page" x="0"  y="0"  width="80" height="110" rx="3"/>
    <rect class="page" x="40" y="20" width="80" height="110" rx="3"/>
    <rect class="page" x="80" y="40" width="80" height="110" rx="3"/>
    <g class="line">
      <rect x="8"  y="14" width="60" height="3" rx="1"/>
      <rect x="8"  y="22" width="50" height="3" rx="1"/>
      <rect x="48" y="34" width="60" height="3" rx="1"/>
      <rect x="48" y="42" width="40" height="3" rx="1"/>
      <rect x="88" y="54" width="60" height="3" rx="1"/>
      <rect x="88" y="62" width="55" height="3" rx="1"/>
    </g>
    <!-- bates stamps, bottom-right of each page -->
    <text class="lbl stamp" x="64"  y="106" text-anchor="end" style="animation-delay:.0s">ACME000001</text>
    <text class="lbl stamp" x="104" y="126" text-anchor="end" style="animation-delay:.4s">ACME000002</text>
    <text class="lbl stamp" x="144" y="146" text-anchor="end" style="animation-delay:.8s">ACME000003</text>
  </g>
  <text x="160" y="185" text-anchor="middle" font="600 10px ui-sans-serif,system-ui" font-size="10" fill="#475569">Sequential legal-grade page IDs</text>
</svg>
