<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Crop — trim margins precisely">
  <style>
    .cap { font-family: ui-sans-serif, system-ui; font-size: 13px; fill: #e9ecf2; font-weight: 600; }
    .ink { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; fill: #0c0e12; }
    .doc { fill: #e9ecf2; stroke: #d1d5db; }
    .lbl { font-family: ui-sans-serif, system-ui; font-size: 10px; fill: #9aa3b2; }
    .line { stroke: #9ca3af; stroke-width: 1.2; fill: none; }

    @keyframes selIn { 0%, 15% { opacity: 0; } 30%, 100% { opacity: 1; } }
    .sel, .handles, .shadow { animation: selIn 4s infinite ease; }
    .shadow { animation-delay: 0.5s; }
    @media (prefers-reduced-motion: reduce) { .sel, .handles, .shadow { opacity: 1; } }
    </style>
  <rect width="600" height="400" fill="#0c0e12"/>
  <text class="cap" x="300" y="34" text-anchor="middle">Crop — trim margins precisely</text>
  
  <g class="orig">
    <rect class="doc" x="120" y="80" width="360" height="280" rx="4"/>
    <line class="line" x1="140" y1="120" x2="460" y2="120"/>
    <line class="line" x1="140" y1="140" x2="450" y2="140"/>
    <line class="line" x1="140" y1="160" x2="430" y2="160"/>
    <line class="line" x1="140" y1="200" x2="460" y2="200"/>
    <line class="line" x1="140" y1="220" x2="440" y2="220"/>
    <line class="line" x1="140" y1="260" x2="460" y2="260"/>
    <line class="line" x1="140" y1="280" x2="440" y2="280"/>
    <line class="line" x1="140" y1="300" x2="450" y2="300"/>
  </g>
  <!-- crop selection -->
  <rect class="sel" x="170" y="110" width="260" height="200" rx="2" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="4 3" opacity="0"/>
  <!-- corner handles -->
  <g class="handles" opacity="0">
    <rect x="166" y="106" width="8" height="8" fill="#7dd3fc"/>
    <rect x="426" y="106" width="8" height="8" fill="#7dd3fc"/>
    <rect x="166" y="306" width="8" height="8" fill="#7dd3fc"/>
    <rect x="426" y="306" width="8" height="8" fill="#7dd3fc"/>
  </g>
  <!-- shadow of trimmed region -->
  <g class="shadow" opacity="0">
    <rect x="120" y="80"  width="360" height="30"  fill="#0c0e12" opacity="0.7"/>
    <rect x="120" y="310" width="360" height="50"  fill="#0c0e12" opacity="0.7"/>
    <rect x="120" y="110" width="50"  height="200" fill="#0c0e12" opacity="0.7"/>
    <rect x="430" y="110" width="50"  height="200" fill="#0c0e12" opacity="0.7"/>
  </g>
    
</svg>
