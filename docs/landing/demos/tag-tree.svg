<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Loom — accessibility structure tree drawn into the document">
  <defs>
    <style>
      .page { fill:#fff; stroke:#94a3b8; stroke-width:.75 }
      .line { fill:#cbd5e1 }
      .node { fill:#7c3aed }
      .edge { stroke:#7c3aed; stroke-width:1.25; fill:none }
      .lbl  { font: 700 7px ui-monospace,monospace; fill:#fff }
      .cap  { font: 700 8px ui-monospace,monospace; fill:#7c3aed }
      @keyframes draw { 0%,20%{stroke-dashoffset:60} 60%,100%{stroke-dashoffset:0} }
      @keyframes pop  { 0%,30%{opacity:0;transform:scale(.5)} 50%,100%{opacity:1;transform:scale(1)} }
      .edge { stroke-dasharray:60; stroke-dashoffset:60; animation: draw 3.6s ease infinite }
      .n1 { animation: pop 3.6s ease infinite; animation-delay:.0s; transform-origin:center }
      .n2 { animation: pop 3.6s ease infinite; animation-delay:.4s; transform-origin:center }
      .n3 { animation: pop 3.6s ease infinite; animation-delay:.8s; transform-origin:center }
      .n4 { animation: pop 3.6s ease infinite; animation-delay:1.2s; transform-origin:center }
      .n5 { animation: pop 3.6s ease infinite; animation-delay:1.6s; transform-origin:center }
      @media (prefers-reduced-motion: reduce) {
        .edge { stroke-dashoffset:0; animation:none }
        .n1,.n2,.n3,.n4,.n5 { animation:none; opacity:1; transform:none }
      }
    </style>
  </defs>
  <rect width="320" height="200" fill="#f8fafc"/>
  <!-- doc preview -->
  <g transform="translate(30,32)">
    <rect class="page" width="110" height="136" rx="3"/>
    <g class="line">
      <rect x="10" y="14" width="80" height="6" rx="1" fill="#7c3aed" opacity=".15"/>
      <rect x="10" y="30" width="90" height="3" rx="1"/>
      <rect x="10" y="38" width="70" height="3" rx="1"/>
      <rect x="10" y="50" width="90" height="3" rx="1"/>
      <rect x="10" y="66" width="60" height="6" rx="1" fill="#7c3aed" opacity=".15"/>
      <rect x="10" y="82" width="90" height="3" rx="1"/>
      <rect x="10" y="90" width="60" height="3" rx="1"/>
      <rect x="10" y="102" width="80" height="20" rx="2" fill="#cbd5e1"/>
    </g>
  </g>
  <!-- tree on right -->
  <g transform="translate(170,30)">
    <text class="cap" x="0" y="0">&lt;StructTree&gt;</text>
    <path class="edge" d="M14 10 L14 30"/>
    <path class="edge" d="M14 40 L14 60"/>
    <path class="edge" d="M14 70 L14 90"/>
    <path class="edge" d="M14 70 L14 120"/>
    <path class="edge" d="M14 130 L14 150"/>

    <g class="n1"><rect x="0"  y="14" width="36" height="14" rx="2" class="node"/><text class="lbl" x="18" y="24" text-anchor="middle">H1</text></g>
    <g class="n2"><rect x="0"  y="44" width="36" height="14" rx="2" class="node"/><text class="lbl" x="18" y="54" text-anchor="middle">P</text></g>
    <g class="n3"><rect x="0"  y="74" width="36" height="14" rx="2" class="node"/><text class="lbl" x="18" y="84" text-anchor="middle">H2</text></g>
    <g class="n4"><rect x="0" y="104" width="36" height="14" rx="2" class="node"/><text class="lbl" x="18" y="114" text-anchor="middle">P</text></g>
    <g class="n5"><rect x="0" y="134" width="46" height="14" rx="2" class="node"/><text class="lbl" x="23" y="144" text-anchor="middle">Figure</text></g>
  </g>
  <text x="160" y="190" text-anchor="middle" font="600 9px ui-sans-serif,system-ui" font-size="9" fill="#475569">PDF/UA-1 tag tree, generated locally · ⌘⇧T</text>
</svg>
