<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Beacon: ask questions about your PDF locally, no cloud">
  <style>
    .cap   { font-family: ui-sans-serif, system-ui; font-size: 13px; fill: #e9ecf2; font-weight: 600; }
    .ink   { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; fill: #0c0e12; }
    .panel { fill: #1b1f26; stroke: #232831; }
    .doc   { fill: #fff; stroke: #d1d5db; }
    .user  { fill: #232831; stroke: #2a313c; }
    .ai    { fill: #1b1f26; stroke: #7dd3fc; }
    .label { font-family: ui-sans-serif, system-ui; font-size: 10px; fill: #cdd4e0; }
    .reply { font-family: ui-sans-serif, system-ui; font-size: 11px; fill: #e9ecf2; }
    .badge { font-family: ui-sans-serif, system-ui; font-size: 9px; fill: #86efac; font-weight: 600; }

    @keyframes qIn { 0%, 10% { opacity: 0; transform: translateY(8px); } 25%, 100% { opacity: 1; transform: translateY(0); } }
    @keyframes thinking { 0%, 30% { opacity: 0; } 40%, 55% { opacity: 1; } 60%, 100% { opacity: 0; } }
    @keyframes aIn { 0%, 55% { opacity: 0; transform: translateY(8px); } 70%, 100% { opacity: 1; transform: translateY(0); } }
    @keyframes badgePulse { 0%, 70% { opacity: 0; } 80%, 100% { opacity: 1; } }
    @keyframes dot1 { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes dot2 { 0%, 100% { opacity: 0.3; } 33% { opacity: 1; } }
    @keyframes dot3 { 0%, 100% { opacity: 0.3; } 16% { opacity: 1; } }

    .q-bubble { animation: qIn 5s infinite ease; opacity: 0; }
    .think    { animation: thinking 5s infinite ease; opacity: 0; }
    .think .d1 { animation: dot1 0.9s infinite linear; }
    .think .d2 { animation: dot2 0.9s infinite linear; }
    .think .d3 { animation: dot3 0.9s infinite linear; }
    .a-bubble { animation: aIn 5s infinite ease; opacity: 0; }
    .badge    { animation: badgePulse 5s infinite ease; opacity: 0; }

    @media (prefers-reduced-motion: reduce) {
      .q-bubble, .a-bubble, .badge { opacity: 1; }
      .think { opacity: 0; }
    }
  </style>
  <rect width="600" height="400" fill="#0c0e12"/>
  <text class="cap" x="300" y="34" text-anchor="middle">Beacon — ask your PDF, offline</text>

  <!-- Source doc (left) -->
  <rect class="doc" x="40" y="80" width="160" height="240" rx="4"/>
  <text class="ink" x="55" y="105">CONTRACT</text>
  <text class="ink" x="55" y="130">Term: 24 months</text>
  <text class="ink" x="55" y="148">Price: $42,000/yr</text>
  <text class="ink" x="55" y="166">Net 15 terms.</text>
  <text class="ink" x="55" y="184">Cov: 24 / 7.</text>
  <text class="ink" x="55" y="202">SLA: 99.9%.</text>
  <text class="ink" x="55" y="220">Renewal: auto.</text>
  <text class="ink" x="55" y="238">Notice: 60 days.</text>
  <text class="ink" x="55" y="270">— Acme Corp</text>

  <!-- Chat panel (right) -->
  <rect class="panel" x="220" y="80" width="340" height="280" rx="6"/>
  <text class="label" x="235" y="100">Beacon · local · llama-3-8b</text>

  <!-- User question -->
  <g class="q-bubble">
    <rect class="user" x="290" y="120" width="255" height="36" rx="8"/>
    <text class="reply" x="302" y="142">What's the total cost over the term?</text>
  </g>

  <!-- Thinking dots -->
  <g class="think">
    <rect class="ai" x="235" y="172" width="50" height="22" rx="8"/>
    <circle class="d1" cx="248" cy="183" r="2.5" fill="#7dd3fc"/>
    <circle class="d2" cx="258" cy="183" r="2.5" fill="#7dd3fc"/>
    <circle class="d3" cx="268" cy="183" r="2.5" fill="#7dd3fc"/>
  </g>

  <!-- Assistant answer -->
  <g class="a-bubble">
    <rect class="ai" x="235" y="210" width="310" height="100" rx="8"/>
    <text class="reply" x="247" y="232">$42,000 × 2 years = </text>
    <text class="reply" x="247" y="250" fill="#86efac" font-weight="600">$84,000 total.</text>
    <text class="reply" x="247" y="275" fill="#9aa3b2" font-size="10">Sources: page 1, lines 2–3</text>
    <text class="reply" x="247" y="290" fill="#9aa3b2" font-size="10">(Term, Price)</text>
  </g>

  <!-- Privacy badge -->
  <g class="badge">
    <rect x="430" y="328" width="115" height="22" rx="11" fill="#1b1f26" stroke="#86efac"/>
    <circle cx="446" cy="339" r="4" fill="#86efac"/>
    <text class="badge" x="456" y="343">runs on this Mac</text>
  </g>
</svg>
