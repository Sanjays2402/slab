<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Encrypt — password-protect any PDF">
  <style>
    .cap { font-family: ui-sans-serif, system-ui; font-size: 13px; fill: #e9ecf2; font-weight: 600; }
    .ink { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; fill: #0c0e12; }
    .doc { fill: #e9ecf2; stroke: #d1d5db; }
    .lbl { font-family: ui-sans-serif, system-ui; font-size: 10px; fill: #9aa3b2; }
    .line { stroke: #9ca3af; stroke-width: 1.2; fill: none; }

    @keyframes veilIn { 0%, 20% { opacity: 0; } 40%, 100% { opacity: 0.92; } }
    @keyframes lockIn { 0%, 30% { opacity: 0; transform: translate(300px, 180px) scale(0.6); }
                       55%, 100% { opacity: 1; transform: translate(300px, 200px) scale(1); } }
    @keyframes starsIn { 0%, 45% { opacity: 0; } 60%, 100% { opacity: 1; } }
    .veil  { animation: veilIn 4s infinite ease; }
    .lock  { animation: lockIn 4s infinite ease; transform-origin: 300px 200px; }
    .lock-stars { animation: starsIn 4s infinite ease; }
    @media (prefers-reduced-motion: reduce) {
      .veil { opacity: 0.92; } .lock { opacity: 1; transform: translate(300px,200px) scale(1); }
      .lock-stars { opacity: 1; }
    }
    </style>
  <rect width="600" height="400" fill="#0c0e12"/>
  <text class="cap" x="300" y="34" text-anchor="middle">Encrypt — password-protect any PDF</text>
  
  <rect class="doc" x="150" y="90" width="300" height="240" rx="4"/>
  <line class="line" x1="170" y1="120" x2="430" y2="120"/>
  <line class="line" x1="170" y1="140" x2="420" y2="140"/>
  <line class="line" x1="170" y1="160" x2="430" y2="160"/>
  <line class="line" x1="170" y1="180" x2="410" y2="180"/>
  <line class="line" x1="170" y1="210" x2="430" y2="210"/>
  <line class="line" x1="170" y1="230" x2="430" y2="230"/>
  <line class="line" x1="170" y1="260" x2="420" y2="260"/>

  <!-- veil that fades in over content -->
  <rect class="veil" x="150" y="90" width="300" height="240" rx="4" fill="#0c0e12" opacity="0"/>
  <text class="ink lock-stars" x="300" y="210" text-anchor="middle" fill="#7dd3fc" font-size="22" font-weight="700" opacity="0">••••••••••</text>

  <!-- padlock svg -->
  <g class="lock" transform="translate(300, 200)" opacity="0">
    <path d="M -16 0 v -8 q 0 -16 16 -16 t 16 16 v 8" fill="none" stroke="#7dd3fc" stroke-width="3"/>
    <rect x="-22" y="0" width="44" height="36" rx="4" fill="#1b1f26" stroke="#7dd3fc" stroke-width="2"/>
    <circle cx="0" cy="16" r="3" fill="#7dd3fc"/>
    <line x1="0" y1="18" x2="0" y2="26" stroke="#7dd3fc" stroke-width="2"/>
  </g>
    
</svg>
