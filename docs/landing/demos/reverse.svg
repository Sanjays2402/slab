<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Reverse pages demo">
  <defs>
    <style>
      @keyframes slide-r {
        0%, 30% { transform: translateX(0) }
        70%, 100% { transform: translateX(160px) }
      }
      @keyframes slide-l {
        0%, 30% { transform: translateX(0) }
        70%, 100% { transform: translateX(-160px) }
      }
      .p1 { animation: slide-r 3.4s ease-in-out infinite alternate; transform-origin: center }
      .p5 { animation: slide-l 3.4s ease-in-out infinite alternate; transform-origin: center }
      .num { font: 600 14px ui-sans-serif,system-ui; fill:#0f172a }
    </style>
  </defs>
  <rect width="320" height="200" fill="#f8fafc"/>
  <g transform="translate(20,40)">
    <g class="p1"><rect width="40" height="60" rx="3" fill="#fff" stroke="#94a3b8"/><text class="num" x="20" y="38" text-anchor="middle">1</text></g>
  </g>
  <g transform="translate(70,40)">
    <rect width="40" height="60" rx="3" fill="#fff" stroke="#cbd5e1"/><text class="num" x="20" y="73" text-anchor="middle">2</text>
  </g>
  <g transform="translate(120,40)">
    <rect width="40" height="60" rx="3" fill="#fff" stroke="#cbd5e1"/><text class="num" x="20" y="73" text-anchor="middle">3</text>
  </g>
  <g transform="translate(170,40)">
    <rect width="40" height="60" rx="3" fill="#fff" stroke="#cbd5e1"/><text class="num" x="20" y="73" text-anchor="middle">4</text>
  </g>
  <g transform="translate(220,40)">
    <g class="p5"><rect width="40" height="60" rx="3" fill="#fff" stroke="#94a3b8"/><text class="num" x="20" y="38" text-anchor="middle">5</text></g>
  </g>
  <text x="160" y="125" text-anchor="middle" font-size="10" fill="#94a3b8">1 → 5    becomes    5 → 1</text>
  <text x="160" y="185" text-anchor="middle" font-size="10" fill="#475569">Flip page order in one command</text>
</svg>
