    <text class="ink t5" x="92"  y="220" fill="#cdd4e0" opacity="0">2.1 Data sources</text>
    <text class="ink t6" x="92"  y="238" fill="#cdd4e0" opacity="0">2.2 Analysis</text>
    <text class="ink t7" x="76"  y="265" fill="#e9ecf2" opacity="0">▶ 3. Results</text>
    <text class="ink t8" x="76"  y="290" fill="#e9ecf2" opacity="0">▶ 4. Discussion</text>
    <text class="ink t9" x="76"  y="315" fill="#e9ecf2" opacity="0">▶ 5. Appendix</text>
  </g>

