<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Outline / TOC — generate &amp; navigate">
  <style>
    .cap { font-family: ui-sans-serif, system-ui; font-size: 13px; fill: #e9ecf2; font-weight: 600; }
    .ink { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; fill: #0c0e12; }
    .doc { fill: #e9ecf2; stroke: #d1d5db; }
    .lbl { font-family: ui-sans-serif, system-ui; font-size: 10px; fill: #9aa3b2; }
    .line { stroke: #9ca3af; stroke-width: 1.2; fill: none; }

    @keyframes fadeIn { 0%, 10% { opacity: 0; } 30%, 100% { opacity: 1; } }
    .toc text { animation: fadeIn 4s infinite ease; }
    .t1 { animation-delay: 0s; } .t2 { animation-delay: 0.2s; } .t3 { animation-delay: 0.35s; }
    .t4 { animation-delay: 0.55s; } .t5 { animation-delay: 0.7s; } .t6 { animation-delay: 0.85s; }
    .t7 { animation-delay: 1.05s; } .t8 { animation-delay: 1.2s; } .t9 { animation-delay: 1.35s; }
    @media (prefers-reduced-motion: reduce) { .toc text { opacity: 1; } }
    </style>
  <rect width="600" height="400" fill="#0c0e12"/>
  <text class="cap" x="300" y="34" text-anchor="middle">Outline / TOC — generate &amp; navigate</text>
  
