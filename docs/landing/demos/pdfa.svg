<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Convert to PDF/A — conformance badge stamps in">
  <defs>
    <style>
      .page { fill:#fff; stroke:#94a3b8; stroke-width:.75 }
      .line { fill:#cbd5e1 }
      .badge { fill:#16a34a; stroke:#15803d; stroke-width:.75 }
      .btxt { font: 700 8px ui-sans-serif,system-ui; fill:#fff }
      .ring { fill:none; stroke:#22c55e; stroke-width:2; stroke-dasharray:4 3 }
      @keyframes scan { 0%{transform:translateY(0)} 50%{transform:translateY(110px)} 100%{transform:translateY(0)} }
      @keyframes stamp { 0%,55%{transform:scale(.4);opacity:0} 65%,90%{transform:scale(1);opacity:1} 100%{transform:scale(1);opacity:1} }
      @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
      .scanbar { animation: scan 3.6s ease-in-out infinite; transform-origin:center }
      .badgewrap { animation: stamp 3.6s ease-out infinite; transform-origin:228px 130px }
      .ring { animation: spin 6s linear infinite; transform-origin:228px 130px }
      @media (prefers-reduced-motion: reduce) {
        .scanbar { animation: none }
        .badgewrap, .ring { animation: none; opacity: 1; transform: none }
      }
    </style>
  </defs>
  <rect width="320" height="200" fill="#f8fafc"/>
  <!-- the doc -->
  <g transform="translate(60,40)">
    <rect class="page" width="120" height="130" rx="4"/>
    <g class="line">
      <rect x="10" y="14" width="100" height="3" rx="1"/>
      <rect x="10" y="22" width="80"  height="3" rx="1"/>
      <rect x="10" y="34" width="100" height="3" rx="1"/>
      <rect x="10" y="42" width="70"  height="3" rx="1"/>
      <rect x="10" y="54" width="100" height="3" rx="1"/>
      <rect x="10" y="62" width="90"  height="3" rx="1"/>
      <rect x="10" y="74" width="100" height="3" rx="1"/>
      <rect x="10" y="82" width="60"  height="3" rx="1"/>
    </g>
    <!-- scan bar -->
    <rect class="scanbar" x="0" y="0" width="120" height="6" fill="#3b82f6" opacity=".25"/>
  </g>
  <!-- conformance badge stamped on -->
  <g class="badgewrap">
    <circle class="ring" cx="228" cy="130" r="26"/>
    <circle class="badge" cx="228" cy="130" r="20"/>
    <text class="btxt" x="228" y="127" text-anchor="middle">PDF/A</text>
    <text class="btxt" x="228" y="138" text-anchor="middle">2b ✓</text>
  </g>
  <text x="160" y="190" text-anchor="middle" font="600 10px ui-sans-serif,system-ui" font-size="10" fill="#475569">ISO 19005-2 archival, in one click</text>
</svg>
