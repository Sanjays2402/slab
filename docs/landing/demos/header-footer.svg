<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Header &amp; footer — page numbers, dates, branding">
  <style>
    .cap { font-family: ui-sans-serif, system-ui; font-size: 13px; fill: #e9ecf2; font-weight: 600; }
    .ink { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; fill: #0c0e12; }
    .doc { fill: #e9ecf2; stroke: #d1d5db; }
    .lbl { font-family: ui-sans-serif, system-ui; font-size: 10px; fill: #9aa3b2; }
    .line { stroke: #9ca3af; stroke-width: 1.2; fill: none; }

    @keyframes slideTop { 0%, 10% { opacity: 0; transform: translateY(-20px); } 40%, 100% { opacity: 1; transform: translateY(0); } }
    @keyframes slideBot { 0%, 30% { opacity: 0; transform: translateY(20px); } 60%, 100% { opacity: 1; transform: translateY(0); } }
    .header { animation: slideTop 4s infinite ease; transform-origin: 300px 70px; }
    .footer { animation: slideBot 4s infinite ease; transform-origin: 300px 360px; }
    @media (prefers-reduced-motion: reduce) { .header, .footer { opacity: 1; transform: none; } }
    </style>
  <rect width="600" height="400" fill="#0c0e12"/>
  <text class="cap" x="300" y="34" text-anchor="middle">Header &amp; footer — page numbers, dates, branding</text>
  
  <rect class="doc" x="150" y="70" width="300" height="300" rx="4"/>
  <g class="header" opacity="0">
    <rect x="150" y="70" width="300" height="28" fill="#1b1f26" rx="4"/>
    <text class="ink" x="166" y="89" fill="#7dd3fc" font-weight="600">ACME CORP · Q3 2026 REPORT</text>
    <text class="ink" x="434" y="89" fill="#9aa3b2" text-anchor="end">2026-09-30</text>
  </g>
  <line class="line" x1="170" y1="125" x2="430" y2="125"/>
  <line class="line" x1="170" y1="145" x2="420" y2="145"/>
  <line class="line" x1="170" y1="165" x2="430" y2="165"/>
  <line class="line" x1="170" y1="195" x2="410" y2="195"/>
  <line class="line" x1="170" y1="215" x2="430" y2="215"/>
  <line class="line" x1="170" y1="245" x2="430" y2="245"/>
  <line class="line" x1="170" y1="265" x2="420" y2="265"/>
  <line class="line" x1="170" y1="295" x2="400" y2="295"/>
  <g class="footer" opacity="0">
    <rect x="150" y="342" width="300" height="28" fill="#1b1f26" rx="4"/>
    <text class="ink" x="166" y="361" fill="#9aa3b2">Confidential · Internal use only</text>
    <text class="ink" x="434" y="361" fill="#7dd3fc" text-anchor="end" font-weight="600">p. 7 of 42</text>
  </g>
    
</svg>
