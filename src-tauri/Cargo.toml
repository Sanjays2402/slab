[package]
name = "slab-app"
version = "3.10.0"
description = "Slab — fast, free, offline PDF tool"
authors = ["Sanjay Santhanam <51058514+Sanjays2402@users.noreply.github.com>"]
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/Sanjays2402/slab"
default-run = "slab-app"

[lib]
name = "slab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "slab"
path = "src/bin/slab.rs"

# Maintainer signing tool (v1.4.0 Bench Slice 2). Reads
# ~/.slab-maintainer-key and emits a signed marketplace IndexEntry.
# Never shipped to end-users — built from-source by the maintainer.
[[bin]]
name = "slab-sign-plugin"
path = "src/bin/sign_plugin.rs"

# v2.1.0 "Server" 🐳 — HTTP daemon exposing the core PDF operations
# over a REST API. Same Rust core as the Tauri desktop app, but
# headless — Docker-friendly, behind a reverse proxy on a NAS, or
# embedded in a homelab Compose stack. Frontend ships as a single
# embedded index.html so a fresh `docker run` is a one-step setup.
[[bin]]
name = "slab-server"
path = "src/server_main.rs"
required-features = ["server"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# PDF manipulation: pure-Rust, no native deps
lopdf = "0.40"

# TrueType inspection for PDF/A font-embed pass (v3.0.2 Foundry Fonts)
ttf-parser = { version = "0.21", default-features = false, features = ["std"] }

# Markdown parser for md2pdf
pulldown-cmark = { version = "0.12", default-features = false }

# Regex engine for auto-redact
regex = "1"

# Async runtime for long-running ops (compress, OCR later)
tokio = { version = "1", features = ["full"] }

# Temp directories for OCR rasterization pipeline
tempfile = "3"
# Cross-platform home/config dir lookup for first-launch self-install.
dirs = "6"

# Beacon (v0.10.0 AI features) — HTTP client for talking to local
# Ollama and remote OpenAI-compatible servers, async-trait for the
# AiProvider trait, futures for streaming response handling.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
async-trait = "0.1"
futures-util = "0.3"
bytes = "1"
# Beacon config file (`~/.slab/config.toml`) parser. Tiny, no_std-friendly,
# zero unsafe — good citizen.
toml = "0.8"
# Beacon embedding index storage (Slice 6). `bundled` ships SQLite with
# the crate so we don't depend on the host's libsqlite3 — keeps Windows
# / macOS Tauri bundles self-contained. `blob` is needed for raw f32
# embedding storage. We skip `sqlite-vec` for v1: brute-force cosine
# in Rust handles up to ~200k chunks @ 768d in <100ms on M1, and we
# avoid the cross-platform extension-loading headache.
rusqlite = { version = "0.39", features = ["bundled", "blob"] }
# Beacon: PDF content hash → cache key for the embedding index. `sha2`
# is already transitively pulled by reqwest TLS, so this is a zero-cost
# explicit dep.
sha2 = "0.11"

# Atlas (v0.12.0 Library Mode) — recursive directory walk for the
# library scanner. Skips broken symlinks gracefully and gives us a
# stable iteration order. Single-file no-features-by-default crate.
walkdir = "2"
rayon = "1.10"

# Lens (v0.13.0 Slice 5 Vision Q&A) — PNG decode + post-render rect crop.
# `default-features = false` keeps the dep tree small: we only need PNG,
# not JPEG/WebP/GIF/TIFF. Used by `ai::vision` for rasterize + downscale.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Base64-encode rendered PNGs for the Ollama `messages[].images` field.
# Tiny crate, no_std-friendly, zero unsafe.
base64 = "0.22"

# Stack (v0.14.0) — Myers/Patience diff engine. Drives `pdf::diff` line+token
# diffing for PDF compare. Pure-Rust, single crate, no transitive bloat.
# Used only at user-trigger time so it stays out of the hot render path.
similar = "2.6"

# Bench (v1.4.0) — Ed25519 signature verification for marketplace
# index entries. Pure-Rust, no openssl, no native deps; Slab's
# maintainer key is hard-coded as a const byte array in
# `marketplace::verify`.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# Bench (v1.4.0 Slice 4) — atomic plugin tarball install.
# `flate2` for gzip decode (rust_backend, no zlib system dep);
# `tar` for archive iteration with directory-traversal guards. Both
# crates have zero unsafe in the hot path and no transitive bloat.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"

# Workshop (v2.0.0) — embedded QuickJS interpreter for plugin scripting.
# `rquickjs` bundles QuickJS as a C dep compiled via `cc`; first build
# is ~3-5 min, incremental rebuilds are fast. `std` is the only feature
# we need for Slice 1 (basic eval + globals); ES6 modules, parallel,
# array-buffer etc. can be turned on per-slice later if needed.
rquickjs = { version = "0.11", default-features = false, features = ["std"] }

# Workshop (v2.0.0 Slice 6) — per-plugin actor mailbox channel. We pick
# crossbeam-channel over std::sync::mpsc for `Sender::send(&self)` (mpsc
# requires `&mut`), bounded vs unbounded toggling, and a future `select!`
# in the worker loop (Slice 6.5). Tiny crate, single-author, no transitive
# bloat.
crossbeam-channel = "0.5"

# Signet (v3.10.0) — PKCS#7 detached digital signatures for PDFs.
# Pure-Rust RustCrypto stack avoids OpenSSL on Windows/Linux/macOS bundles
# and keeps the Tauri binary single-blob portable. See ADR 0011.
cms = { version = "0.2", features = ["builder"] }
x509-cert = { version = "0.2", features = ["pem", "builder"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
p256 = { version = "0.13", features = ["pkcs8", "ecdsa", "pem"] }
p384 = { version = "0.13", features = ["pkcs8", "ecdsa", "pem"] }
der = "0.7"
pkcs8 = { version = "0.10", features = ["pem", "encryption"] }
spki = "0.7"
const-oid = { version = "0.9", features = ["db"] }
pem = "3"
directories = "5"

# Server (v2.1.0 "Server" 🐳) — optional axum HTTP server stack for
# `slab-server`. Gated behind the `server` feature so the desktop bundle
# stays lean; Docker / homelab builds opt-in with `--features server`.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "multipart", "macros"], optional = true }
tower = { version = "0.5", default-features = false, optional = true }
tower-http = { version = "0.6", default-features = false, features = ["cors", "limit", "trace"], optional = true }
mime = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"], optional = true }
# Zip the multi-file "split" responses so the client gets one download
# regardless of how many output PDFs the operation produced.
zip = { version = "2", default-features = false, features = ["deflate", "time"], optional = true }

[features]
default = []
# Opt-in flag for the `slab-server` binary. Desktop Tauri builds leave
# this off so they don't pay the axum/tower compile + binary-size cost.
server = ["dep:axum", "dep:tower", "dep:tower-http", "dep:mime", "dep:tracing", "dep:tracing-subscriber", "dep:zip"]

[dev-dependencies]
tempfile = "3"
# Beacon mock HTTP server for provider unit tests (no real Ollama in CI).
mockito = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Signet (v3.10.0) — RNG for generating throwaway self-signed certs in tests.
rand = "0.8"

[profile.release]
opt-level = "s"      # optimize for size
lto = true           # link-time optimization
codegen-units = 1    # better optimization at cost of compile time
panic = "abort"      # smaller binary
strip = true         # strip symbols
