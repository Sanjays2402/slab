[package]
name = "slab-app"
version = "0.9.1"
description = "Slab — fast, free, offline PDF tool"
authors = ["Sanjay Santhanam <51058514+Sanjays2402@users.noreply.github.com>"]
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/Sanjays2402/slab"
default-run = "slab-app"

[lib]
name = "slab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "slab"
path = "src/bin/slab.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"

# PDF manipulation: pure-Rust, no native deps
lopdf = "0.40"

# Markdown parser for md2pdf
pulldown-cmark = { version = "0.12", default-features = false }

# Regex engine for auto-redact
regex = "1"

# Async runtime for long-running ops (compress, OCR later)
tokio = { version = "1", features = ["full"] }

# Temp directories for OCR rasterization pipeline
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"      # optimize for size
lto = true           # link-time optimization
codegen-units = 1    # better optimization at cost of compile time
panic = "abort"      # smaller binary
strip = true         # strip symbols
