# Hello Slab — example plugin that exercises every contribution kind.
#
# Drop this folder into ~/.slab/plugins/ and click "Reload" in
# Settings → Plugins. See docs/PLUGINS.md for the full reference.

id = "com.example.hello-slab"
name = "Hello Slab"
version = "0.1.0"
slab_compat = ">=1.3.0"
description = "Example plugin demonstrating themes, locales, commands, AI providers, and PDF actions."
author = "Cake"
homepage = "https://github.com/Sanjays2402/slab"
permissions = ["fs", "spawn"]

# A custom dark theme. Paths are relative to this plugin's directory.
# Discoverable in Cmd-K → Appearance.
[[contributions.themes]]
id = "midnight"
label = "Midnight"
css = "themes/midnight.css"
dark = true

# Japanese UI locale. Bundle is a flat JSON map: "settings.title" -> "設定".
# Missing keys fall back to English so partial coverage is OK.
[[contributions.locales]]
locale = "jp"
bundle = "locales/jp.json"

# Custom command that opens the Slab GitHub repo in the system browser.
# Discoverable via Cmd-K → "Plugin commands".
[[contributions.commands]]
id = "open-github"
label = "Open Slab on GitHub"
url = "https://github.com/Sanjays2402/slab"

# A shell command. Runs `echo Hello from Slab plugin` and surfaces the
# stdout in a toast. Discoverable via Cmd-K.
[[contributions.commands]]
id = "hello-shell"
label = "Say hello from a shell"
shell = "echo 'Hello from Slab plugin'"

# An AI provider pointing at a local Ollama instance.
# Surfaces in Cmd-K → "Plugin AI providers"; full Beacon hook-up is
# planned for a future v1.3.x patch.
[[contributions.ai_providers]]
id = "local-ollama"
label = "Local Ollama"
kind = "openai_compat"
base_url = "http://127.0.0.1:11434/v1"
default_model = "llama3.2"

# A PDF action. Linearizes the current document via qpdf.
# Surfaces in the Reader's "✦ Plugin" dropdown when a PDF is open.
# Requires qpdf in $PATH. {in} and {out} are replaced at runtime with
# the source PDF path and the user-chosen output path.
[[contributions.pdf_actions]]
id = "qpdf-linearize"
label = "Linearize with qpdf"
cli = "qpdf"
args = ["--linearize", "{in}", "{out}"]
timeout_ms = 60000
