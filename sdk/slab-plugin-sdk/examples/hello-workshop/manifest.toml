id = "hello-workshop"
name = "Hello Workshop"
version = "0.1.0"
slab_compat = ">=2.0.0 <3.0.0"
description = "Smallest possible Slab v2.0.0 plugin — registers a 'Say Hi' tool."
author = "Slab Plugin SDK examples"
homepage = "https://github.com/Sanjays2402/slab/tree/main/sdk/slab-plugin-sdk/examples/hello-workshop"
permissions = []

[contributions]
themes = []
locales = []
pdf_actions = []
commands = []
ai_providers = []

[runtime]
entry = "script.js"
# Computed at build time from the bundled script.js. Update if you
# regenerate the script; the host hard-fails on hash mismatch.
sha256 = "REPLACE_ME_AT_BUILD_TIME_64_HEX_CHARS_REPLACE_ME_AT_BUILD_TIME_xx"

  [runtime.capabilities]
  fs = "none"
  net = "none"
  ui = "tool"
  beacon = "none"
  net_allow_hosts = []
  fs_allow_paths = []
